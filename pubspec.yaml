name: mars_logging
description: "Mars integration for logging package."
version: 0.0.1-dev.3
repository: "https://github.com/yanshouwang/mars_logging"
issue_tracker: "https://github.com/yanshouwang/mars_logging/issues"
topics:
  - mars
  - logging

environment:
  sdk: ^3.6.0
  # Flutter versions prior to 3.7 did not support the
  # sharedDarwinSource option.
  flutter: ">=3.7.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: ^24.2.2

flutter:
  plugin:
    platforms:
      android:
        package: dev.hebei.mars_logging
        pluginClass: MarsLoggingPlugin
      ios:
        sharedDarwinSource: true
        pluginClass: MarsLoggingPlugin
      macos:
        sharedDarwinSource: true
        pluginClass: MarsLoggingPlugin
      windows:
        pluginClass: MarsLoggingPluginCApi
      linux:
        pluginClass: MarsLoggingPlugin
