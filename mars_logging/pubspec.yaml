name: mars_logging
description: 'Mars integration for logging package.'
version: 1.0.0-dev.1
repository: 'https://github.com/yanshouwang/mars_logging'
issue_tracker: 'https://github.com/yanshouwang/mars_logging/issues'
topics:
  - mars
  - logging

environment:
  sdk: ^3.7.2
  flutter: '>=3.7.0'
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  mars_logging_platform_interface: ^1.0.0-dev.1
  mars_logging_android: ^1.0.0-dev.1
  mars_logging_darwin: ^1.0.0-dev.1
  logging: ^1.3.0
  convert: ^3.1.2
  zstd: ^0.0.1-dev.1
  pointycastle: ^4.0.0
  path: ^1.9.1
  cross_file: ^0.3.4+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        default_package: mars_logging_android
      ios:
        default_package: mars_logging_darwin
      macos:
        default_package: mars_logging_darwin
